<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduPrep - База Знаний</title>
    <link rel="stylesheet" href="./style.css">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <button id="mobile-menu-btn" class="mobile-menu-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h1>EduPrep</h1>
          <p>База знаний</p>
        </div>
        <nav id="category-nav">
          <!-- Categories will be injected here -->
        </nav>
      </aside>

      <main class="content">
        <div class="search-container">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search-input" placeholder="Поиск по вопросам и ответам..." />
        </div>

        <div class="questions-header">
          <h2 id="current-category-title">Все предметы</h2>
          <span id="questions-count">0 вопросов</span>
        </div>

        <div class="questions-list" id="questions-list">
          <!-- Accordion items will be injected here -->
        </div>
      </main>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
